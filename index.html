<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador - Lava-Jato Automatizado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 30px;
    }
    .painel {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #4fc3f7;
    }
    .sensor-box {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input[type="range"] {
      width: 100%;
      margin: 10px 0;
    }
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    .led {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      margin: 8px auto;
      background-color: #444;
      transition: 0.3s;
    }
    .led.vermelho.ativo {
      background-color: #ff3b30;
      box-shadow: 0 0 12px #ff3b30;
    }
    .led.verde.ativo {
      background-color: #34c759;
      box-shadow: 0 0 12px #34c759;
    }
    .ativo-texto {
      color: #4fc3f7;
      font-weight: bold;
    }
    .fase-atual {
      background: #0d47a1;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1em;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0288d1;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0277bd;
    }
  </style>
</head>
<body>

<div class="painel">
  <h2>Lava-Jato Automatizado</h2>

  <!-- Simulação do Sensor LDR (Pino A0) -->
  <div class="sensor-box">
    <label for="ldrSlider"><strong>Sensor LDR (Luminosidade):</strong> <span id="ldrValor">800</span></label>
    <input type="range" id="ldrSlider" min="0" max="1023" value="800">
    <small>Limiar de detecção: menor que 400 (carro bloqueando a luz)</small>
    <button onclick="simularCarro()">Simular Passagem do Carro</button>
  </div>

  <!-- Componentes de Saída -->
  <div class="status-grid">
    <div class="card">
      <div>LED Vermelho (Pino 2)</div>
      <div id="ledVermelho" class="led vermelho ativo"></div>
      <span id="txtLedVermelho">LIGADO</span>
    </div>

    <div class="card">
      <div>LED Verde (Pino 3)</div>
      <div id="ledVerde" class="led verde"></div>
      <span id="txtLedVerde">DESLIGADO</span>
    </div>

    <div class="card">
      <div>Cancela (Pino 9)</div>
      <p id="statusCancela" class="ativo-texto">0° (Fechada)</p>
    </div>

    <div class="card">
      <div>Escovas (Pino 4)</div>
      <p id="statusEscovas">DESLIGADAS</p>
    </div>

    <div class="card" style="grid-column: span 2;">
      <div>Bomba de Enxágue (Pino 7)</div>
      <p id="statusBomba">DESLIGADA</p>
    </div>
  </div>

  <div class="fase-atual" id="faseTexto">
    Aguardando veículo...
  </div>
</div>

<script>
  // Constantes equivalentes ao código Arduino
  const limiarDeteccao = 400;
  let cicloEmAndamento = false;

  const ldrSlider = document.getElementById("ldrSlider");
  const ldrValor = document.getElementById("ldrValor");

  // Função auxiliar para simular o delay() do Arduino
  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // Atualiza os elementos visuais na tela
  function atualizarComponentes({ vermelho, verde, cancela, escovas, bomba, fase }) {
    const elVermelho = document.getElementById("ledVermelho");
    const elVerde = document.getElementById("ledVerde");

    elVermelho.classList.toggle("ativo", vermelho);
    document.getElementById("txtLedVermelho").innerText = vermelho ? "LIGADO" : "DESLIGADO";

    elVerde.classList.toggle("ativo", verde);
    document.getElementById("txtLedVerde").innerText = verde ? "LIGADO" : "DESLIGADO";

    document.getElementById("statusCancela").innerText = cancela === 90 ? "90° (Aberta)" : "0° (Fechada)";
    
    const elEscovas = document.getElementById("statusEscovas");
    elEscovas.innerText = escovas ? "LIGADAS (Sabão)" : "DESLIGADAS";
    elEscovas.className = escovas ? "ativo-texto" : "";

    const elBomba = document.getElementById("statusBomba");
    elBomba.innerText = bomba ? "LIGADA (Água Filtrada)" : "DESLIGADA";
    elBomba.className = bomba ? "ativo-texto" : "";

    document.getElementById("faseTexto").innerText = fase;
  }

  // Equivalente à função void loop()
  setInterval(() => {
    const leituraLDR = parseInt(ldrSlider.value);
    ldrValor.innerText = leituraLDR;

    if (leituraLDR < limiarDeteccao && !cicloEmAndamento) {
      executarCicloLavagem();
    }
  }, 200);

  // Equivalente à função void executarCicloLavagem()
  async function executarCicloLavagem() {
    cicloEmAndamento = true;

    // Fase 1: Liberação de Entrada
    atualizarComponentes({
      vermelho: false, verde: true, cancela: 90, escovas: false, bomba: false,
      fase: "Fase 1: Liberação de Entrada (3.5s)"
    });
    await delay(3500);

    // Fase 2: Bloqueio e Início do Processamento
    atualizarComponentes({
      vermelho: true, verde: false, cancela: 0, escovas: false, bomba: false,
      fase: "Fase 2: Bloqueio e Início (1s)"
    });
    await delay(1000);

    // Fase 3: Esfregagem Automatizada
    atualizarComponentes({
      vermelho: true, verde: false, cancela: 0, escovas: true, bomba: false,
      fase: "Fase 3: Esfregagem Automatizada (5s)"
    });
    await delay(5000);

    // Fase 4: Enxágue Otimizado
    atualizarComponentes({
      vermelho: true, verde: false, cancela: 0, escovas: false, bomba: true,
      fase: "Fase 4: Enxágue com Água Filtrada (4s)"
    });
    await delay(4000);

    // Fase 5: Saída Liberada
    atualizarComponentes({
      vermelho: false, verde: true, cancela: 90, escovas: false, bomba: false,
      fase: "Fase 5: Saída Liberada (4s)"
    });
    await delay(4000);

    // Retorno ao repouso
    ldrSlider.value = 800; // Restaura luminosidade após saída do carro
    ldrValor.innerText = 800;
    atualizarComponentes({
      vermelho: true, verde: false, cancela: 0, escovas: false, bomba: false,
      fase: "Aguardando veículo..."
    });

    cicloEmAndamento = false;
  }

  // Botão rápido para testar sem precisar arrastar o controle
  function simularCarro() {
    ldrSlider.value = 250;
    ldrValor.innerText = 250;
  }
</script>

</body>
</html>
